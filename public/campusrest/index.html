<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관악캠퍼스 에이전트 둘러보기</title>
<meta name="description" content="합성 학생 225명이 하루 동안 수업 사이에 어디서 쉬는지 보여 주는 인터랙티브 지도. 에이전트를 누르면 이동 이유를 들려줍니다.">
<meta name="theme-color" content="#f3ead9">
<meta property="og:type" content="website">
<meta property="og:title" content="관악캠퍼스 에이전트 둘러보기">
<meta property="og:description" content="합성 학생 225명의 하루 시뮬레이션. 에이전트를 눌러 보세요.">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map" role="img" aria-label="관악캠퍼스 지도 위를 걸어 다니는 합성 학생 에이전트들. 에이전트를 누르면 이동 이유가 나옵니다."></canvas>
<div id="bubble" class="bubble" hidden></div>

<aside id="side" class="glass" aria-label="둘러보기 설정">
  <div id="sideBody">
    <h1>관악캠퍼스 에이전트 둘러보기</h1>
    <p class="sub">합성 학생 225명의 하루</p>
    <p id="hint" class="hint">불러오는 중…</p>

    <section>
      <h2>시뮬레이션 조건</h2>
      <dl class="kv">
        <dt>날짜</dt><dd id="kvDate">-</dd>
        <dt>모집단</dt><dd id="kvPop">-</dd>
        <dt>장소</dt><dd id="kvPlace">-</dd>
        <dt>규칙</dt><dd>후보 선별 규칙 적용 (v3)</dd>
      </dl>
      <p class="cap">날짜나 성향 분포를 바꾼 결과를 보려면 시뮬레이션을 새로 돌려야 해요. 지금은 이 결과 안에서 학생을 골라 볼 수 있어요.</p>
    </section>

    <section id="filters">
      <h2>학생 고르기 <span id="shown" class="count"></span></h2>
      <div class="frow"><span class="flab">학년</span><div id="years" class="chips" role="group" aria-label="학년 선택"></div></div>
      <div id="prefs"></div>
      <button id="btnReset" class="btn sm ghost" type="button">전체 보기</button>
    </section>
  </div>
</aside>
<button id="sideTab" class="tab glass" type="button" aria-expanded="true" aria-controls="sideBody" aria-label="패널 접기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>

<div id="pill" class="glass" role="group" aria-label="지금 상황">
  <div id="clock" class="clock" aria-live="off">--:--</div>
  <div id="temp" class="chip" aria-label="기온">--°C</div>
  <ul class="stats">
    <li><span class="dot rest"></span>야외 휴식 <b id="nRest">0</b></li>
    <li><span class="dot walk"></span>이동 중 <b id="nWalk">0</b></li>
    <li><span class="dot cls"></span>수업·건물 안 <b id="nCls">0</b></li>
  </ul>
</div>

<aside id="card" class="glass" hidden aria-label="선택한 에이전트">
  <div class="cardtop">
    <canvas id="avatar" width="176" height="176" aria-hidden="true"></canvas>
    <div>
      <h2 id="cName">-</h2>
      <p id="cInfo" class="info">-</p>
      <p id="cState" class="state">-</p>
    </div>
  </div>
  <p id="cWhy" class="why"></p>
  <div class="cardbtns">
    <button id="btnNext" class="btn" type="button">다음 이동 ⏭</button>
    <button id="btnClose" class="btn ghost" type="button" aria-label="선택 해제">닫기 ✕</button>
  </div>
</aside>

<nav id="controls" class="glass" aria-label="재생 컨트롤">
  <button id="btnRestart" class="btn icon" type="button" aria-label="처음부터">⏮</button>
  <button id="btnPlay" class="btn icon accent" type="button" aria-label="일시정지">⏸</button>
  <button id="btnRandom" class="btn accent" type="button" aria-label="아무나 만나기" title="아무나 만나기">🎲<span class="lbl"> 아무나 만나기</span></button>
  <input id="slider" type="range" min="0" max="1" step="0.5" value="0" aria-label="시간 이동">
  <div id="speeds" class="speeds" role="group" aria-label="재생 속도">
    <button type="button" class="btn sm" data-speed="1" aria-pressed="false">×1</button>
    <button type="button" class="btn sm" data-speed="3" aria-pressed="true">×3</button>
    <button type="button" class="btn sm" data-speed="10" aria-pressed="false">×10</button>
    <button type="button" class="btn sm" data-speed="30" aria-pressed="false">×30</button>
  </div>
</nav>

<div id="toast" class="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
